# Supabase paket gratis menjeda proyek yang tidak dipakai selama 7 hari.
# Tugas ini menyapa database dua kali seminggu supaya tetap aktif, juga saat libur semester.
name: Jaga database tetap aktif
on:
  schedule:
    - cron: "17 1 * * 1,4"
  workflow_dispatch:
jobs:
  sapa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sapa database
        run: |
          URL=$(grep -oP 'url:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'key:\s*"\K[^"]+' config.js)
          curl -fsS -X POST "${URL%/}/rest/v1/rpc/api" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"aksi":"ping"}'
